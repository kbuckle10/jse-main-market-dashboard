<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSE Main Market Dashboard</title><style>:root{--bg:#090e19;--p:#111827;--bd:#25324a;--tx:#eef2ff;--m:#94a3b8;--g:#34d399;--y:#fbbf24;--o:#fb923c;--r:#f87171;--a:#60a5fa}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,sans-serif;font-size:13px}.scale{width:133.333333%;transform:scale(.75);transform-origin:top left}.w{width:100%;padding:10px 14px}header{display:flex;align-items:baseline;gap:14px;min-width:0}h1{font-size:25px;line-height:1.05;margin:3px 0 5px;white-space:nowrap}#sub{font-size:12px;color:var(--m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info{padding:7px 10px;border-left:3px solid var(--a);background:var(--p);border-radius:7px;font-size:12px;margin-bottom:7px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:7px 0}.card{background:var(--p);border:1px solid var(--bd);border-radius:9px;padding:6px 9px;display:flex;align-items:center;justify-content:space-between}.card .m{color:var(--m);font-size:12px}.card .num{font-size:21px;font-weight:800}.ctrl{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:7px;margin:7px 0}input,select{height:34px;background:var(--p);color:var(--tx);border:1px solid var(--bd);padding:4px 8px;border-radius:7px;font-size:12px}.tw{overflow:auto;border:1px solid var(--bd);border-radius:8px}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:6px 6px;border-bottom:1px solid var(--bd);font-size:11.5px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{background:#0e1626;position:sticky;top:0;font-size:11px}th:nth-child(-n+4),td:nth-child(-n+4){text-align:left}th:nth-child(1){width:4.5%}th:nth-child(2){width:10%}th:nth-child(3){width:9%}th:nth-child(4){width:11%}th:nth-child(5){width:6%}th:nth-child(6),th:nth-child(7){width:4%}th:nth-child(8){width:5%}th:nth-child(9){width:5.5%}th:nth-child(10){width:5%}th:nth-child(11){width:7.5%}th:nth-child(12){width:7.5%}th:nth-child(13){width:4.5%}th:nth-child(14){width:7%}.b{padding:3px 5px;border-radius:999px;font-weight:800;font-size:10px}.BUY{background:var(--g);color:#052e1d}.HOLD{background:var(--y);color:#422006}.WATCH{background:var(--o);color:#431407}.AVOID{background:var(--r);color:#450a0a}.pos{color:var(--g)}.neg{color:var(--r)}@media(max-width:900px){.scale{width:100%;transform:none}.w{padding:8px}header{display:block}h1{font-size:20px}.info{display:none}.cards{grid-template-columns:repeat(5,minmax(90px,1fr));overflow:auto}.ctrl{grid-template-columns:1fr 1fr}.tw table{min-width:1200px}}</style></head><body><div class="scale"><div class="w"><header><h1>JSE Main Market Equity Research & Buy-Zone Tracker</h1><div id="sub">Loading…</div></header><div class="info"><b>Valuation:</b> official completed JSE close drives price-dependent ratios • P/B assessed with ROE • filings + StockAnalysis supply fundamentals/trends.</div><div id="cards" class="cards"></div><div class="ctrl"><input id="q" placeholder="Search"><select id="r"><option value="">All ratings</option><option>BUY</option><option>HOLD</option><option>WATCH</option><option>AVOID</option></select><select id="sec"><option value="">All sectors</option></select><select id="sort"><option value="score">Score ↓</option><option value="pb">P/B ↑</option><option value="roe">ROE ↓</option><option value="pe">P/E ↑</option><option value="yield">Yield ↓</option></select></div><div class="tw"><table><thead><tr><th>Ticker</th><th>Company</th><th>Sector</th><th>Rating Basis</th><th>JSE Close</th><th>P/E</th><th>P/B</th><th>ROE</th><th>EPS Gr.</th><th>Yield</th><th>Fair Value</th><th>Buy Zone</th><th>Score</th><th>Rating</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>let X=[];const f=x=>x==null?'N/A':Number(x).toFixed(2);async function load(){const d=await(await fetch('data.json?v='+Date.now(),{cache:'no-store'})).json();X=d.stocks;sub.textContent=`${d.asOf} • JSE close authoritative`;[...new Set(X.map(x=>x.sector))].sort().forEach(x=>sec.innerHTML+=`<option>${x}</option>`);go()}function go(){let a=X.filter(x=>(!q.value||(`${x.ticker} ${x.company}`).toLowerCase().includes(q.value.toLowerCase()))&&(!r.value||x.rating===r.value)&&(!sec.value||x.sector===sec.value));let k=sort.value;a.sort((x,y)=>k==='score'?y.score-x.score:k==='pb'?(x.pb??999)-(y.pb??999):k==='roe'?(y.roe??-999)-(x.roe??-999):k==='pe'?(x.pe??999)-(y.pe??999):y.divYield-x.divYield);rows.innerHTML=a.map(x=>`<tr><td><b>${x.ticker}</b></td><td title="${x.company}">${x.company}</td><td title="${x.sector}">${x.sector}</td><td title="${x.ratingBasis}">${x.ratingBasis}</td><td>J$${f(x.price)}</td><td>${f(x.pe)}</td><td>${f(x.pb)}</td><td class="${x.roe>12?'pos':x.roe<5?'neg':''}">${x.roe==null?'N/A':f(x.roe)+'%'}</td><td class="${x.epsGrowth>0?'pos':x.epsGrowth<0?'neg':''}">${x.epsGrowth==null?'N/A':x.epsGrowth+'%'}</td><td>${f(x.divYield)}%</td><td>${x.fairValue||'N/A'}</td><td>${x.buyZone||'N/A'}</td><td><b>${x.score}</b></td><td><span class="b ${x.rating}">${x.rating}</span></td></tr>`).join('');let c={BUY:0,HOLD:0,WATCH:0,AVOID:0};X.forEach(x=>c[x.rating]++);cards.innerHTML=[['Universe',X.length],['BUY',c.BUY],['HOLD',c.HOLD],['WATCH',c.WATCH],['AVOID',c.AVOID]].map(z=>`<div class="card"><span class="m">${z[0]}</span><span class="num">${z[1]}</span></div>`).join('')}[q,r,sec,sort].forEach(e=>e.oninput=go);load();</script></body></html>
