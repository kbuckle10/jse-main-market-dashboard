name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Weekly JSE Main Market Refresh"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate dashboard JavaScript and JSON
        shell: bash
        run: |
          set -e
          node --check app.js
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('data.json','utf8')); if(!Array.isArray(d.stocks)||!d.stocks.length) throw new Error('data.json stocks missing/empty'); console.log('Validated',d.stocks.length,'stocks');"
          if [ -f research.json ]; then
            node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('research.json','utf8')); if(!Array.isArray(d.stocks)) throw new Error('research.json stocks missing'); console.log('Validated research overlay',d.stocks.length);"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
