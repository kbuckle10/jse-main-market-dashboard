name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Weekly JSE Main Market Refresh"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate deterministic dashboard artifact
        shell: bash
        run: |
          set -euo pipefail
          node --check score-engine.js
          node --check app.js
          node --check cashflow.js
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('cashflow-data.json','utf8')); if(!Array.isArray(d.companies)||!d.companies.length) throw new Error('cashflow-data.json missing companies'); console.log('Validated cash flows',d.companies.length);"
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('data.json','utf8')); if(!Array.isArray(d.stocks)||!d.stocks.length) throw new Error('data.json stocks missing/empty'); console.log('Validated',d.stocks.length,'stocks');"
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const scripts=[...h.matchAll(/<script[^>]+src=\"([^\"]+)\"/g)].map(m=>m[1]); if(scripts.length!==3||!scripts[0].startsWith('score-engine.js?')||!scripts[1].startsWith('app.js?')||!scripts[2].startsWith('cashflow.js?')) throw new Error('index.html must load score engine, app renderer and cashflow: '+JSON.stringify(scripts)); console.log('Validated dashboard scripts',scripts);"
          if [ -f research.json ]; then
            node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('research.json','utf8')); if(!Array.isArray(d.stocks)) throw new Error('research.json stocks missing'); console.log('Validated research overlay',d.stocks.length);"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
