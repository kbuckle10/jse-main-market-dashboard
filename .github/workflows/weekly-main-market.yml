name: Weekly JSE Main Market Refresh

on:
  workflow_dispatch:
  schedule:
    # 8:00 AM Jamaica (UTC-5) every Saturday; analyst-coordinated refresh 2026-09-12
    - cron: '0 13 * * 6'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/weekly-main-market.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: weekly-jse-main-market
  cancel-in-progress: true

jobs:
  refresh:
    # Playwright Chromium is not supported by the ubuntu-26.04 image selected by ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Merge latest research overlay
        run: npm run apply:research

      - name: Collect JSE Main Market universe and direct instrument URLs
        run: npm run refresh:jse-links

      - name: Make dashboard ticker links use captured JSE instrument URLs
        run: npm run patch:dashboard-links

      - name: Refresh StockAnalysis historical performance and fundamentals
        run: npm run refresh:sa

      - name: Override cross-listed stocks from StockAnalysis primary listings
        run: npm run refresh:crosslisted

      - name: Enrich StockAnalysis published ratios and analyst metrics
        run: npm run refresh:sa-ratios

      - name: Collect five-stock cash-flow batch from StockAnalysis
        run: node scripts/collect-cashflow-batch-01.mjs
        continue-on-error: true

      - name: Collect official JSE Trade Summary market data
        run: npm run refresh:jse
        # Never publish a supposedly refreshed official-price dataset if this step fails.
        continue-on-error: false

      - name: Persist auditable six-part Opportunity Scores
        run: npm run refresh:scores

      - name: Generate material weekly analyst delta report
        run: npm run report:weekly

      - name: Validate refreshed dataset
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data.json','utf8'));
          if(!Array.isArray(d.stocks)||!d.stocks.length) throw new Error('stocks missing');
          const badLinks=d.stocks.filter(x=>!/^https:\/\/www\.jamstockex\.com\/trading\/instruments\/\?instrument=\d+$/.test(x.jseUrl||''));
          if(badLinks.length) throw new Error('Missing direct JSE instrument URLs: '+badLinks.map(x=>x.ticker).join(','));
          const badScores=d.stocks.filter(x=>{const c=x.scoreComponents||{};const vals=[c.valuation,c.quality,c.growth,c.financialStrength,c.dividend,c.momentum];return vals.some(v=>!Number.isFinite(Number(v)))||vals.reduce((a,b)=>a+Number(b),0)!==Math.round(Number(x.score));});
          if(badScores.length) throw new Error('Invalid scoreComponents: '+badScores.map(x=>x.ticker).join(','));
          const caps={valuation:25,quality:20,growth:20,financialStrength:15,dividend:10,momentum:10};
          const outOfBounds=d.stocks.filter(x=>Object.entries(caps).some(([k,max])=>Number(x.scoreComponents?.[k])<0||Number(x.scoreComponents?.[k])>max));
          if(outOfBounds.length)throw new Error('Score component exceeds maximum: '+outOfBounds.map(x=>x.ticker).join(','));
          const official=d.stocks.filter(x=>x.priceSource==='JSE'&&x.priceDate===d.asOf).length;
          if(official<Math.ceil(d.stocks.length*.7))throw new Error('Insufficient fresh official JSE price coverage: '+official+'/'+d.stocks.length);
          const unclassified=d.stocks.filter(x=>!x.fairValue&&!x.buyZone&&x.valuationStatus!=='VALUATION REVIEW');
          if(unclassified.length)throw new Error('Unflagged valuation gaps: '+unclassified.map(x=>x.ticker).join(','));
          console.log('Official Friday price coverage',official,'/',d.stocks.length);
          const ghl=d.stocks.find(x=>x.ticker==='GHL');
          if(ghl && !String(ghl.saUrl||'').includes('/quote/ttse/GHL/')) throw new Error('GHL is not using TTSE StockAnalysis primary listing');
          console.log(`Validated ${d.stocks.length} stocks, direct links, scoreComponents and GHL provenance`);
          NODE

      - name: Archive weekly snapshot
        shell: bash
        run: |
          DATE=$(TZ=America/Jamaica date +%F)
          mkdir -p history
          cp data.json "history/${DATE}.json"
          echo "Archived history/${DATE}.json"

      - name: Commit refreshed dashboard data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp data.json /tmp/data.json
          cp weekly-report.json /tmp/weekly-report.json
          if test -f research/cashflow-batch-01.json; then cp research/cashflow-batch-01.json /tmp/cashflow-batch-01.json; fi
          DATE=$(TZ=America/Jamaica date +%F)
          cp "history/${DATE}.json" "/tmp/history-${DATE}.json"

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/data.json data.json
          cp /tmp/weekly-report.json weekly-report.json
          if test -f /tmp/cashflow-batch-01.json; then mkdir -p research; cp /tmp/cashflow-batch-01.json research/cashflow-batch-01.json; fi
          mkdir -p history
          cp "/tmp/history-${DATE}.json" "history/${DATE}.json"

          git add data.json weekly-report.json "history/${DATE}.json"
          if test -f research/cashflow-batch-01.json; then git add research/cashflow-batch-01.json; fi
          if git diff --cached --quiet; then
            echo "No dashboard data changes to commit."
          else
            git commit -m "Weekly JSE Main Market refresh ${DATE}"
            git push origin HEAD:main
          fi
