name: Weekly JSE Main Market Refresh

on:
  workflow_dispatch:
  schedule:
    # 8:00 AM Jamaica (UTC-5) every Saturday
    - cron: '0 13 * * 6'

permissions:
  contents: write

concurrency:
  group: weekly-jse-main-market
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Merge latest research overlay
        run: npm run apply:research

      - name: Collect JSE Main Market universe and direct instrument URLs
        # Reference strategy: kbuckle10/daily-jse-market-dashboard/scripts/refresh-jse-links.mjs
        # Authoritative universe: JSE Listed Companies. Direct instrument URLs replace generic tag links.
        run: npm run refresh:jse-links
        continue-on-error: true

      - name: Make dashboard ticker links use captured JSE instrument URLs
        run: npm run patch:dashboard-links

      - name: Refresh StockAnalysis historical performance and fallback quotes
        # SA supplies history/performance and remains an explicitly labelled fallback when JSE is unavailable.
        run: npm run refresh:sa

      - name: Collect official JSE Trade Summary market data
        # Reference strategy: kbuckle10/daily-jse-market-dashboard/scripts/refresh-jse-market.mjs
        # Run JSE after SA so official data always overrides a delayed SA quote.
        run: npm run refresh:jse
        continue-on-error: true

      - name: Archive weekly snapshot
        shell: bash
        run: |
          DATE=$(TZ=America/Jamaica date +%F)
          mkdir -p history
          cp data.json "history/${DATE}.json"
          echo "Archived history/${DATE}.json"

      - name: Commit refreshed dashboard data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html history/ package.json package-lock.json scripts/ .github/workflows/weekly-main-market.yml
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            DATE=$(TZ=America/Jamaica date +%F)
            git commit -m "Weekly JSE Main Market refresh ${DATE}"
            git push
          fi
