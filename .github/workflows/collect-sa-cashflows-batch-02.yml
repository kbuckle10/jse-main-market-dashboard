name: Collect StockAnalysis Cash Flows (Batch 2)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collect-sa-cashflows-batch-02.yml'
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Parse five additional cash-flow statements
        run: node scripts/collect-sa-cashflows.mjs SEP KW SJ SGJ CPJ
      - name: Validate and publish collected cash flows
        run: |
          node scripts/merge-sa-cashflows.mjs research/sa-cashflows-batch.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cashflow-data.json
          git diff --cached --quiet || (git commit -m "Update dashboard with validated SA cash-flow Batch 2" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sa-cashflows-batch-02
          path: research/sa-cashflows-batch.json
          if-no-files-found: warn
